# Publishes the static interactive move viewer (docs/viewer.md) to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy viewer to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["viewer/**", "scripts/viewer-*", "src/model/**", "data/traces/**", "data/geometry.json", "moves/**", "shots/**", ".github/workflows/viewer-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run viewer:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist
      - id: deployment
        uses: actions/deploy-pages@v4
